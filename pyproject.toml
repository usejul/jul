[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "jul"
dynamic = ["version"]
description = "Just use Less - local typed decisions with the interface of the TypeSafe (Jev) SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# The model runs on a backend installed as an extra: [mlx] on Apple Silicon, [torch] anywhere else.
dependencies = ["numpy>=1.24"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://usejul.github.io/jul/"
Repository = "https://github.com/usejul/jul"
Issues = "https://github.com/usejul/jul/issues"

[project.optional-dependencies]
mlx = ["mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
       "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'"]
torch = ["torch>=2.4", "transformers>=5.0", "accelerate"]
# CPU inference without torch, on a model exported by `python -m jul.backends.onnx_export`.
onnx = ["onnxruntime>=1.18", "tokenizers>=0.20", "jinja2>=3.1"]
onnx-export = ["jul[torch]", "onnx>=1.16", "onnxscript"]
yaml = ["pyyaml>=6"]
# Laya (convaiinnovations/laya) runs on its own package: `TypeSafeClient(model="laya")`, jul/laya_model.py.
laya = ["laya>=0.3.27"]
# Lexical and hybrid autotune heads train with scikit-learn (and run with numpy alone).
tune = ["scikit-learn>=1.3", "scipy>=1.10"]
# OpenTelemetry export (JUL_ENABLE_TELEMETRY=1). OTLP over HTTP; add opentelemetry-exporter-otlp-proto-grpc for grpc.
# 1.38: the first release whose Logger.emit takes event_name= (jul.request / jul.decision events); CI tests it
otel = ["opentelemetry-sdk>=1.38", "opentelemetry-exporter-otlp-proto-http>=1.38"]
# `jul models add` downloads its calibration data with `datasets`.
calibrate = ["datasets", "pyarrow"]
# The lab trains its heads with MLX.
lab = ["jul[mlx]", "pyyaml>=6", "datasets", "pyarrow"]
# Everything needed to re-run the measurements in docs/benchmarks.md > Reproducing.
repro = ["jul[mlx]", "pyyaml>=6", "datasets", "pyarrow", "pytest>=8", "scikit-learn>=1.3"]
dev = ["pytest>=8", "pyyaml>=6"]
# scripts/build_docs.py: docs/*.md -> the documentation site (site/docs/).
docs = ["markdown>=3.5"]

[project.scripts]
jul = "jul_cli.main:main"

[tool.setuptools_scm]
# The version comes from git: a tag v0.2.0 builds 0.2.0; N commits after the last tag build the next
# patch as a .devN (0.1.2.dev7), which pip sorts after the last release. No local "+g<sha>" part,
# which PyPI and TestPyPI refuse. Written to lib/jul/_version.py at build/install (not committed).
version_file = "lib/jul/_version.py"
local_scheme = "no-local-version"

[tool.setuptools]
package-dir = {"jul" = "lib/jul", "jul.backends" = "lib/jul/backends", "jul.lab" = "lib/jul/lab", "jul_cli" = "cli/jul_cli"}
packages = ["jul", "jul.backends", "jul.lab", "jul_cli"]

[tool.setuptools.package-data]
jul = ["assets/*.npy", "assets/*.json", "assets/presets/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a model; run with JUL_SLOW=1",
           "torch: needs the torch backend and the transformers weights"]
